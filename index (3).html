<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Emulador GBA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --gold:   #F5C842;   --gold2:  #E8A020;
    --dark:   #0A0A0F;   --dark2:  #12121A;   --dark3: #1A1A26;
    --accent: #00E5FF;   --accent2:#00B8D4;
    --green:  #00E676;   --red:    #FF1744;
    --text:   #E0E0F0;   --text2:  #9090B0;
    --border: rgba(245,200,66,0.2);
    --glow:   0 0 20px rgba(245,200,66,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: var(--dark);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }

  .card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5), var(--glow);
    width: 100%;
    max-width: 680px;
  }

  .header { text-align: center; margin-bottom: 25px; }
  .header .emoji { font-size: 48px; margin-bottom: 8px; }
  .header .title {
    font-family: Orbitron, sans-serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
  }

  .quote-box {
    background: rgba(245,200,66,0.08);
    border-left: 4px solid var(--gold);
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 25px;
  }

  #upload-box {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 18px;
    text-align: center;
  }
  #upload-box label {
    font-family: Rajdhani, sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    font-size: 13px;
  }

  input[type=file] {
    color: var(--text2);
    margin-top: 14px;
    font-family: Rajdhani, sans-serif;
  }
  input[type=file]::file-selector-button {
    padding: 12px 28px;
    font-family: Orbitron, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #000;
    border: none;
    border-radius: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  input[type=file]::file-selector-button:hover {
    box-shadow: 0 0 20px rgba(245,200,66,0.5);
  }

  .badge {
    display: inline-block;
    font-family: Orbitron, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 3px;
    background: rgba(245,200,66,0.15);
    color: var(--gold);
    margin-top: 12px;
  }

  #game-wrapper {
    width: 100%;
    max-width: 680px;
    display: none;
    margin-top: 20px;
  }
  #game {
    width: 100%;
    aspect-ratio: 3 / 2;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="emoji">🎮</div>
    <div class="title">MI EMULADOR GBA</div>
    <div class="subtitle">Juega tus propios cartuchos de Game Boy Advance desde el navegador</div>
  </div>

  <div class="quote-box">
    Sube tu propio archivo ROM (.gba). Solo debes usar copias que tú mismo hayas
    volcado de tus propios cartuchos físicos.
  </div>

  <div id="upload-box">
    <label for="romFile">Seleccionar archivo ROM (.gba)</label><br>
    <input type="file" id="romFile" accept=".gba,.zip,application/octet-stream,*/*">
    <br><span class="badge">Formato .GBA</span>
  </div>

  <div id="game-wrapper">
    <div id="game"></div>
  </div>
</div>

<script>
  const input = document.getElementById('romFile');
  const gameWrapper = document.getElementById('game-wrapper');
  const uploadBox = document.getElementById('upload-box');

  input.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    // Crea una URL temporal en el propio navegador del usuario para el archivo subido
    const romUrl = URL.createObjectURL(file);

    uploadBox.style.display = 'none';
    gameWrapper.style.display = 'block';

    // Configuración de EmulatorJS
    window.EJS_player = '#game';
    window.EJS_gameUrl = romUrl;
    window.EJS_core = 'gba';           // núcleo para Game Boy Advance
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);
  });
</script>

</body>
</html>
