<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Emulador GBA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --gold:   #F5C842;   --gold2:  #E8A020;
    --dark:   #0A0A0F;   --dark2:  #12121A;   --dark3: #1A1A26;
    --accent: #00E5FF;   --accent2:#00B8D4;
    --green:  #00E676;   --red:    #FF1744;
    --text:   #E0E0F0;   --text2:  #9090B0;
    --border: rgba(245,200,66,0.2);
    --glow:   0 0 20px rgba(245,200,66,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: var(--dark);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }

  .card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5), var(--glow);
    width: 100%;
    max-width: 680px;
  }

  .header { text-align: center; margin-bottom: 25px; }
  .header .emoji { font-size: 48px; margin-bottom: 8px; }
  .header .title {
    font-family: Orbitron, sans-serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
  }

  .quote-box {
    background: rgba(245,200,66,0.08);
    border-left: 4px solid var(--gold);
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 25px;
  }

  #upload-box {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 18px;
    text-align: center;
  }
  #upload-box label {
    font-family: Rajdhani, sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    font-size: 13px;
  }

  input[type=file] {
    color: var(--text2);
    margin-top: 14px;
    font-family: Rajdhani, sans-serif;
  }
  input[type=file]::file-selector-button {
    padding: 12px 28px;
    font-family: Orbitron, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #000;
    border: none;
    border-radius: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  input[type=file]::file-selector-button:hover {
    box-shadow: 0 0 20px rgba(245,200,66,0.5);
  }

  .badge {
    display: inline-block;
    font-family: Orbitron, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 3px;
    background: rgba(245,200,66,0.15);
    color: var(--gold);
    margin-top: 12px;
  }

  #game-wrapper {
    width: 100%;
    display: none;
    margin-top: 4px;
  }
  #game-frame-box {
    width: 100%;
    aspect-ratio: 3 / 2;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  #game-frame-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* ---------- Barra inferior con el botón Game Boy ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 16px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .toolbar-info { flex: 1; min-width: 0; }
  .toolbar-label {
    font-family: Orbitron, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  #status {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    margin-top: 6px;
  }
  #status.warn { color: var(--red); }
  #status.ok   { color: var(--green); }

  .btn-secondary {
    margin-top: 10px;
    padding: 10px 20px;
    font-family: Rajdhani, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-secondary:hover { background: rgba(245,200,66,0.1); }

  /* Botón en forma de Game Boy (dibujado con CSS) */
  .gb-btn {
    flex: none;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .gb {
    position: relative;
    width: 70px;
    height: 100px;
    background: var(--text2);
    border: 2px solid var(--gold);
    border-radius: 8px 8px 24px 8px;
    box-shadow: var(--glow);
    transition: transform 0.15s, box-shadow 0.3s;
  }
  .gb-btn:active .gb { transform: scale(0.94); }
  .gb-screen {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    height: 38px;
    background: var(--dark);
    border: 2px solid var(--dark3);
    border-radius: 4px 4px 12px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--green);
    text-shadow: 0 0 8px var(--green);
  }
  .gb-dpad {
    position: absolute;
    left: 10px; top: 58px;
    width: 24px; height: 24px;
  }
  .gb-dpad::before, .gb-dpad::after {
    content: "";
    position: absolute;
    background: var(--dark3);
    border-radius: 2px;
  }
  .gb-dpad::before { left: 8px; top: 0; width: 8px; height: 24px; }
  .gb-dpad::after  { left: 0; top: 8px; width: 24px; height: 8px; }
  .gb-ab {
    position: absolute;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--red);
  }
  .gb-a { right: 8px; top: 58px; }
  .gb-b { right: 22px; top: 68px; }

  .gb-btn.spin .gb-screen span { animation: gbspin 0.7s linear; display: inline-block; }
  @keyframes gbspin { to { transform: rotate(360deg); } }

  .gb-btn.alert .gb { animation: gbpulse 1s infinite; border-color: var(--red); }
  @keyframes gbpulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255,23,68,0.4); }
    50%      { box-shadow: 0 0 30px rgba(255,23,68,0.9); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="emoji">🎮</div>
    <div class="title">MI EMULADOR GBA</div>
    <div class="subtitle">Juega tus propios cartuchos de Game Boy Advance desde el navegador</div>
  </div>

  <div class="quote-box">
    Sube tu propio archivo ROM (.gba). Solo debes usar copias que tú mismo hayas
    volcado de tus propios cartuchos físicos.
  </div>

  <div id="upload-box">
    <label for="romFile">Seleccionar archivo ROM (.gba)</label><br>
    <input type="file" id="romFile" accept=".gba,.zip,application/octet-stream,*/*">
    <br><span class="badge">Formato .GBA</span>
  </div>

  <div id="game-wrapper">
    <div id="game-frame-box"></div>

    <div class="toolbar">
      <button class="gb-btn" id="resetBtn" title="Reiniciar emulador" aria-label="Reiniciar emulador">
        <div class="gb">
          <div class="gb-screen"><span>↻</span></div>
          <div class="gb-dpad"></div>
          <div class="gb-ab gb-a"></div>
          <div class="gb-ab gb-b"></div>
        </div>
      </button>
      <div class="toolbar-info">
        <div class="toolbar-label">Reiniciar emulador</div>
        <div id="status">Cargando juego…</div>
        <button class="btn-secondary" id="changeBtn">Cambiar ROM</button>
      </div>
    </div>
  </div>
</div>

<script>
  const input        = document.getElementById('romFile');
  const gameWrapper  = document.getElementById('game-wrapper');
  const uploadBox    = document.getElementById('upload-box');
  const frameBox     = document.getElementById('game-frame-box');
  const resetBtn     = document.getElementById('resetBtn');
  const changeBtn    = document.getElementById('changeBtn');
  const statusEl     = document.getElementById('status');

  let romUrl       = null;
  let autosaveKey  = null;
  let autosaveTimer = null;
  let watchdog     = null;
  let frame        = null;
  let useAutosave  = true;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function uint8ToBase64(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function base64ToUint8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function getEmu() {
    try { return frame && frame.contentWindow && frame.contentWindow.EJS_emulator; }
    catch (err) { return null; }
  }

  function saveNow() {
    try {
      const emu = getEmu();
      if (emu && emu.gameManager && autosaveKey) {
        const state = emu.gameManager.saveState();
        localStorage.setItem(autosaveKey, uint8ToBase64(state));
      }
    } catch (err) { /* silencioso */ }
  }

  // Guarda al salir de la app (iOS puede liberar la pestaña)
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveNow();
  });

  // El emulador vive dentro de un iframe: así "reiniciar" es destruirlo y crearlo
  // de cero, sin necesidad de recargar la página ni volver a elegir el ROM.
  function buildFrameHtml(url) {
    return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>html,body{margin:0;height:100%;background:#1A1A26}#game{width:100%;height:100%}</style>' +
      '</head><body><div id="game"></div><script>' +
      'window.EJS_player="#game";' +
      'window.EJS_gameUrl=' + JSON.stringify(url) + ';' +
      'window.EJS_core="gba";' +
      'window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";' +
      'window.EJS_startOnLoaded=true;' +
      'window.EJS_onGameStart=function(){parent.postMessage({type:"ejs-started"},"*");};' +
      '<\/script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script></body></html>';
  }

  function stopTimers() {
    if (autosaveTimer) { clearInterval(autosaveTimer); autosaveTimer = null; }
    if (watchdog)      { clearTimeout(watchdog);       watchdog = null; }
  }

  function createEmulator() {
    stopTimers();
    frameBox.innerHTML = '';
    resetBtn.classList.remove('alert');
    setStatus('Cargando juego…');

    frame = document.createElement('iframe');
    frame.setAttribute('allow', 'fullscreen; autoplay; gamepad');
    frame.srcdoc = buildFrameHtml(romUrl);
    frameBox.appendChild(frame);

    // Si en 25 s no arrancó, avisa y hace parpadear el botón Game Boy
    watchdog = setTimeout(function () {
      setStatus('Parece que el juego no cargó bien. Toca el Game Boy para reiniciar.', 'warn');
      resetBtn.classList.add('alert');
    }, 25000);
  }

  window.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow) return;
    if (!e.data || e.data.type !== 'ejs-started') return;

    if (watchdog) { clearTimeout(watchdog); watchdog = null; }
    resetBtn.classList.remove('alert');
    setStatus('Juego en marcha ✔', 'ok');

    autosaveTimer = setInterval(saveNow, 15000);

    if (useAutosave && autosaveKey) {
      const saved = localStorage.getItem(autosaveKey);
      if (saved) {
        try { getEmu().gameManager.loadState(base64ToUint8(saved)); }
        catch (err) { /* si falla, sigue desde el inicio */ }
      }
    }
  });

  input.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    if (romUrl) URL.revokeObjectURL(romUrl);
    romUrl = URL.createObjectURL(file);
    autosaveKey = 'gba_autosave_' + file.name;
    useAutosave = true;

    uploadBox.style.display = 'none';
    gameWrapper.style.display = 'block';
    createEmulator();
  });

  // Botón Game Boy: reinicia el emulador desde cero con el mismo ROM.
  // Al reiniciar NO carga el guardado automático, por si ese estado fue lo que falló.
  resetBtn.addEventListener('click', function () {
    if (!romUrl) return;
    resetBtn.classList.remove('spin');
    void resetBtn.offsetWidth;      // reinicia la animación
    resetBtn.classList.add('spin');
    useAutosave = false;
    createEmulator();
  });

  changeBtn.addEventListener('click', function () {
    stopTimers();
    saveNow();
    frameBox.innerHTML = '';
    frame = null;
    if (romUrl) { URL.revokeObjectURL(romUrl); romUrl = null; }
    input.value = '';
    gameWrapper.style.display = 'none';
    uploadBox.style.display = 'block';
  });
</script>

</body>
</html>
