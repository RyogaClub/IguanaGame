<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Emulador GBA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --gold:   #F5C842;   --gold2:  #E8A020;
    --dark:   #0A0A0F;   --dark2:  #12121A;   --dark3: #1A1A26;
    --accent: #00E5FF;   --accent2:#00B8D4;
    --green:  #00E676;   --red:    #FF1744;
    --text:   #E0E0F0;   --text2:  #9090B0;
    --border: rgba(245,200,66,0.2);
    --glow:   0 0 20px rgba(245,200,66,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: var(--dark);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }

  .card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5), var(--glow);
    width: 100%;
    max-width: 680px;
  }

  .header { text-align: center; margin-bottom: 25px; }
  .header .emoji { font-size: 48px; margin-bottom: 8px; }
  .header .title {
    font-family: Orbitron, sans-serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .header .subtitle {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
  }

  .quote-box {
    background: rgba(245,200,66,0.08);
    border-left: 4px solid var(--gold);
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 25px;
  }

  #upload-box {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 18px;
    text-align: center;
  }
  #upload-box label {
    font-family: Rajdhani, sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    font-size: 13px;
  }

  input[type=file] {
    color: var(--text2);
    margin-top: 14px;
    font-family: Rajdhani, sans-serif;
  }
  input[type=file]::file-selector-button {
    padding: 12px 28px;
    font-family: Orbitron, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #000;
    border: none;
    border-radius: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  input[type=file]::file-selector-button:hover {
    box-shadow: 0 0 20px rgba(245,200,66,0.5);
  }

  .badge {
    display: inline-block;
    font-family: Orbitron, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 3px;
    background: rgba(245,200,66,0.15);
    color: var(--gold);
    margin-top: 12px;
  }

  #game-wrapper {
    width: 100%;
    display: none;
    margin-top: 4px;
  }
  #game-frame-box {
    width: 100%;
    aspect-ratio: 3 / 2;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  #game { width: 100%; height: 100%; }
  #game-frame-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* ---------- Barra inferior con el botón Game Boy ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 16px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .toolbar-info { flex: 1; min-width: 0; }
  .toolbar-label {
    font-family: Orbitron, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  #status {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    margin-top: 6px;
  }
  #status.warn { color: var(--red); }
  #status.ok   { color: var(--green); }

  .btn-secondary {
    margin-top: 10px;
    padding: 10px 20px;
    font-family: Rajdhani, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-row .btn-secondary { margin-top: 10px; padding: 8px 14px; font-size: 13px; }
  .footer-ver {
    font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 2px;
    color: var(--text2); opacity: 0.7; text-align: center; margin-top: 22px;
  }
  .btn-secondary:hover { background: rgba(245,200,66,0.1); }

  /* Botón en forma de Game Boy (dibujado con CSS) */
  .gb-btn {
    flex: none;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .gb {
    position: relative;
    width: 70px;
    height: 100px;
    background: var(--text2);
    border: 2px solid var(--gold);
    border-radius: 8px 8px 24px 8px;
    box-shadow: var(--glow);
    transition: transform 0.15s, box-shadow 0.3s;
  }
  .gb-btn:active .gb { transform: scale(0.94); }
  .gb-screen {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    height: 38px;
    background: var(--dark);
    border: 2px solid var(--dark3);
    border-radius: 4px 4px 12px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--green);
    text-shadow: 0 0 8px var(--green);
  }
  .gb-dpad {
    position: absolute;
    left: 10px; top: 58px;
    width: 24px; height: 24px;
  }
  .gb-dpad::before, .gb-dpad::after {
    content: "";
    position: absolute;
    background: var(--dark3);
    border-radius: 2px;
  }
  .gb-dpad::before { left: 8px; top: 0; width: 8px; height: 24px; }
  .gb-dpad::after  { left: 0; top: 8px; width: 24px; height: 8px; }
  .gb-ab {
    position: absolute;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--red);
  }
  .gb-a { right: 8px; top: 58px; }
  .gb-b { right: 22px; top: 68px; }

  .gb-btn.spin .gb-screen span { animation: gbspin 0.7s linear; display: inline-block; }
  @keyframes gbspin { to { transform: rotate(360deg); } }

  .gb-btn.alert .gb { animation: gbpulse 1s infinite; border-color: var(--red); }
  @keyframes gbpulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255,23,68,0.4); }
    50%      { box-shadow: 0 0 30px rgba(255,23,68,0.9); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="emoji">🎮</div>
    <div class="title">MI EMULADOR GBA</div>
    <div class="subtitle">Juega tus propios cartuchos de Game Boy Advance desde el navegador</div>
    <span class="badge" id="version-badge">v1.1.0</span>
  </div>

  <div class="quote-box">
    Sube tu propio archivo ROM (.gba). Solo debes usar copias que tú mismo hayas
    volcado de tus propios cartuchos físicos.
  </div>

  <div id="upload-box">
    <label for="romFile">Seleccionar archivo ROM (.gba)</label><br>
    <input type="file" id="romFile" accept=".gba,.zip,application/octet-stream,*/*">
    <br><span class="badge">Formato .GBA</span>
  </div>

  <div id="game-wrapper">
    <div id="game-frame-box"><div id="game"></div></div>

    <div class="toolbar">
      <button class="gb-btn" id="resetBtn" title="Reiniciar emulador" aria-label="Reiniciar emulador">
        <div class="gb">
          <div class="gb-screen"><span>↻</span></div>
          <div class="gb-dpad"></div>
          <div class="gb-ab gb-a"></div>
          <div class="gb-ab gb-b"></div>
        </div>
      </button>
      <div class="toolbar-info">
        <div class="toolbar-label">Reiniciar emulador</div>
        <div id="status">Cargando juego…</div>
        <div class="btn-row">
          <button class="btn-secondary" id="saveBtn">Guardar</button>
          <button class="btn-secondary" id="fsBtn">Pantalla completa</button>
          <button class="btn-secondary" id="changeBtn">Cambiar ROM</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer-ver">MI EMULADOR GBA · <span id="version-foot"></span></div>

<script>
  const APP_VERSION = 'v1.1.0';
  document.getElementById('version-badge').textContent = APP_VERSION;
  document.getElementById('version-foot').textContent = APP_VERSION;

  const input       = document.getElementById('romFile');
  const gameWrapper = document.getElementById('game-wrapper');
  const uploadBox   = document.getElementById('upload-box');
  const resetBtn    = document.getElementById('resetBtn');
  const changeBtn   = document.getElementById('changeBtn');
  const statusEl    = document.getElementById('status');

  let autosaveKey   = null;
  let autosaveTimer = null;
  let watchdog      = null;
  let skipAutosave  = false;

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  function uint8ToBase64(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function base64ToUint8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  // ---- Guardar el ROM en el navegador (IndexedDB) para poder reiniciar ----
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('gba-emu', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('roms');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbPut(key, val) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction('roms', 'readwrite');
      tx.objectStore('roms').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(key) {
    const db = await idb();
    return new Promise((res, rej) => {
      const q = db.transaction('roms').objectStore('roms').get(key);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  }

  function saveNow() {
    try {
      if (window.EJS_emulator && EJS_emulator.gameManager && autosaveKey) {
        localStorage.setItem(autosaveKey, uint8ToBase64(EJS_emulator.gameManager.saveState()));
      }
    } catch (err) { /* silencioso */ }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveNow();
  });

  function startGame(blob, name) {
    autosaveKey = 'gba_autosave_' + name;
    const saved = skipAutosave ? null : localStorage.getItem(autosaveKey);

    uploadBox.style.display = 'none';
    gameWrapper.style.display = 'block';
    resetBtn.classList.remove('alert');
    setStatus('Cargando juego…');

    window.EJS_player = '#game';
    window.EJS_gameUrl = URL.createObjectURL(blob);
    window.EJS_gameName = name;
    window.EJS_core = 'gba';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    window.EJS_onGameStart = function () {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      resetBtn.classList.remove('alert');
      setStatus('Juego en marcha ✔', 'ok');
      if (autosaveTimer) clearInterval(autosaveTimer);
      autosaveTimer = setInterval(saveNow, 15000);
      if (saved) {
        try { EJS_emulator.gameManager.loadState(base64ToUint8(saved)); } catch (err) {}
      }
    };

    // Si en 25 s no arrancó, avisa y hace parpadear el Game Boy
    watchdog = setTimeout(function () {
      setStatus('Parece que el juego no cargó bien. Toca el Game Boy para reiniciar.', 'warn');
      resetBtn.classList.add('alert');
    }, 25000);

    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);
  }

  input.addEventListener('change', async function (e) {
    const file = e.target.files[0];
    if (!file) return;
    try { await idbPut('lastRom', { blob: file, name: file.name }); } catch (err) {}
    startGame(file, file.name);
  });

  // Botón Game Boy: recarga la página y vuelve a abrir el mismo ROM guardado,
  // sin pedirte el archivo otra vez. No carga el autoguardado (por si ese falló).
  resetBtn.addEventListener('click', function () {
    resetBtn.classList.add('spin');
    try { sessionStorage.setItem('gba_reset', '1'); } catch (err) {}
    setTimeout(function () { location.reload(); }, 300);
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    saveNow();
    setStatus('Partida guardada ✔', 'ok');
  });

  const fsBtn = document.getElementById('fsBtn');
  const fsTarget = document.getElementById('game-frame-box');
  if (!(fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen)) {
    fsBtn.style.display = 'none';   // iPhone no soporta pantalla completa de elementos
  }
  fsBtn.addEventListener('click', function () {
    (fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen).call(fsTarget);
  });

  changeBtn.addEventListener('click', function () {
    saveNow();
    try { sessionStorage.removeItem('gba_reset'); } catch (err) {}
    location.reload();
  });

  // Al recargar por el botón Game Boy, reabre el ROM automáticamente
  (async function () {
    let doReset = false;
    try { doReset = sessionStorage.getItem('gba_reset') === '1'; sessionStorage.removeItem('gba_reset'); } catch (err) {}
    if (!doReset) return;
    try {
      const rom = await idbGet('lastRom');
      if (rom && rom.blob) { skipAutosave = true; startGame(rom.blob, rom.name); }
    } catch (err) {}
  })();
</script>

</body>
</html>
