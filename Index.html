<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Emulador GBA</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.hint { color: #aaa; font-size: 0.9rem; margin-top: 0; text-align: center; max-width: 500px; }
  #upload-box {
    margin: 20px 0;
    padding: 20px;
    border: 2px dashed #555;
    border-radius: 10px;
    text-align: center;
  }
  #game {
    width: 100%;
    max-width: 700px;
    aspect-ratio: 3 / 2;
  }
  input[type=file] { color: #eee; }
</style>
</head>
<body>

<h1>🎮 Mi Emulador de GBA</h1>
<p class="hint">
  Sube tu propio archivo ROM (.gba) para jugar directamente en el navegador.
  Solo debes usar ROMs que tú mismo hayas volcado de tus propios cartuchos.
</p>

<div id="upload-box">
  <label for="romFile"><strong>Selecciona el archivo ROM (.gba):</strong></label><br><br>
  <input type="file" id="romFile" accept=".gba,.zip">
</div>

<div style="width:100%; max-width:700px; display:none;" id="game-wrapper">
  <div id="game"></div>
</div>

<script>
  const input = document.getElementById('romFile');
  const gameWrapper = document.getElementById('game-wrapper');
  const uploadBox = document.getElementById('upload-box');

  input.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    // Crea una URL temporal en el propio navegador del usuario para el archivo subido
    const romUrl = URL.createObjectURL(file);

    uploadBox.style.display = 'none';
    gameWrapper.style.display = 'block';

    // Configuración de EmulatorJS
    window.EJS_player = '#game';
    window.EJS_gameUrl = romUrl;
    window.EJS_core = 'gba';           // núcleo para Game Boy Advance
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);
  });
</script>

</body>
</html>
